server {
    server_name localhost;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    location ^~ /phpmyadmin/ {
            rewrite /phpmyadmin(/.*|$) /$1  break;
            proxy_pass http://phpmyadmin;
            proxy_redirect off;
            proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://flask:5000;
        proxy_redirect off;
        proxy_set_header Host $host;
    }
}