services:
  flask:
    restart: always
    build:
      context: ./
      dockerfile: docker/images/flask/Dockerfile
    container_name: fusion-flask
    volumes:
      - './webserver:/app'
    env_file:
      - '.env'
    depends_on:
      mariadb:
        condition: service_healthy
    external_links:
      - mariadb:mariadb
  
  nginx:
    image: nginx:latest
    container_name: fusion-nginx
    ports:
      - "${WEBSERVER_PORT}:80"
    links:
      - 'flask'
    volumes:
      - './docker/config/nginx:/etc/nginx/conf.d'
    external_links:
      - mariadb:mariadb
      - phpmyadmin:phpmyadmin
    depends_on:
      - flask
  
  mariadb:
    image: mariadb:latest
    container_name: fusion-mariadb
    ports:
      - "${MYSQL_PORT}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - './docker/config/mariadb:/var/lib/mysql'
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -S /run/mysqld/mysqld.sock --silent || mariadb-admin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: fusion-phpmyadmin
    environment:
      - "PMA_HOST=mariadb"
      - "PMA_PORT=${MYSQL_PORT}"
      - "PMA_ABSOLUTE_URI=http://localhost/phpmyadmin"
    external_links:
      - mariadb:mariadb
    volumes:
      - './docker/config/phpmyadmin/sessions:/sessions'
